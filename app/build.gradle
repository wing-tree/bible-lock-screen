plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.dagger.hilt.android)
    alias(libs.plugins.google.devtools.ksp)
    alias(libs.plugins.google.firebase.crashlytics)
    alias(libs.plugins.google.gms.google.services)
    alias(libs.plugins.google.protobuf)
    alias(libs.plugins.jetbrains.kotlin.plugin.parcelize)
}

// 릴리스 서명 정보는 루트의 keystore.properties(gitignore) 에 둔다.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.duke.orca.android.kotlin.biblelockscreen'
    compileSdk 37

    defaultConfig {
        applicationId "com.duke.orca.android.kotlin.biblelockscreen"
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName "2.2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    // 번역별 성경 DB(gitignore). createFromAsset 으로 복사해 쓴다.
    sourceSets {
        main {
            assets.srcDirs += 'assets'
        }
    }
    androidResources {
        ignoreAssetsPattern '*.db-shm:*.db-wal'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    lint {
        disable 'ClickableViewAccessibility', 'SpUsage', 'RtlHardcoded'
    }
}

base {
    archivesName = "the-bible-in-you-${android.defaultConfig.versionCode}-(${android.defaultConfig.versionName})"
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        optIn.add("kotlinx.coroutines.ExperimentalCoroutinesApi")
        optIn.add("kotlinx.coroutines.FlowPreview")
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
